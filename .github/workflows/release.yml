name: Auto Release

# Draait elk uur en checkt of ChasingCoffee/AnanCore een nieuwere release
# heeft dan onze laatste win-anancore release. Als ja: build + publiceer.
# Kan ook handmatig getriggerd worden via Actions → Run workflow.

on:
  schedule:
    - cron: '17 * * * *'   # elk uur op minuut 17
  workflow_dispatch:
    inputs:
      force:
        description: 'Forceer build ook als versie al bestaat'
        type: boolean
        default: false

jobs:
  check-and-release:
    name: Check AnanCore release en publiceer
    runs-on: windows-latest
    permissions:
      contents: write   # nodig voor gh release create

    steps:
      - name: Checkout win-anancore
        uses: actions/checkout@v4

      - name: Haal AnanCore laatste release op
        id: upstream
        shell: pwsh
        run: |
          $release = Invoke-RestMethod `
            "https://api.github.com/repos/ChasingCoffee/AnanCore/releases/latest" `
            -Headers @{ 'User-Agent' = 'win-anancore-builder' }
          $tag  = $release.tag_name
          $name = $release.name
          Write-Host "AnanCore laatste release: $tag ($name)"
          "tag=$tag"   >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Controleer of win-anancore release al bestaat
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.upstream.outputs.tag }}"
          $exists = $false
          try {
            gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
            $exists = $true
          } catch { }
          Write-Host "Release $tag bestaat al: $exists"
          "exists=$($exists.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Sla over als release al bestaat
        if: steps.check.outputs.exists == 'true' && github.event.inputs.force != 'true'
        shell: pwsh
        run: |
          Write-Host "Release ${{ steps.upstream.outputs.tag }} bestaat al — niets te doen."
          exit 0

      - name: Setup .NET 10
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build AnanCore distro
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.upstream.outputs.tag }}"
          Write-Host "Bouwen voor tag: $tag"
          # Branch = tag; als de tag niet bestaat als branch, gebruik freedv-in-core
          $branch = "freedv-in-core"
          try {
            $branches = Invoke-RestMethod `
              "https://api.github.com/repos/ChasingCoffee/AnanCore/branches" `
              -Headers @{ 'User-Agent' = 'win-anancore-builder' }
            if ($branches.name -contains $tag) { $branch = $tag }
          } catch { }
          Write-Host "Gebruikte branch: $branch"
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process
          .\Install-AnanCore.ps1 -Branch $branch -SkipDependencyCheck

      - name: Zip distro
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.upstream.outputs.tag }}"
          $zipName = "AnanCore-windows-x64-$tag.zip"
          Compress-Archive -Path distro\* -DestinationPath $zipName
          Write-Host "Zip aangemaakt: $zipName"
          "zip=$zipName" >> $env:GITHUB_OUTPUT
        id: zip

      - name: Publiceer GitHub Release
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag      = "${{ steps.upstream.outputs.tag }}"
          $upstream = "${{ steps.upstream.outputs.name }}"
          $zip      = "${{ steps.zip.outputs.zip }}"
          $commitHash = git -C src rev-parse --short HEAD 2>$null
          $notes = @"
          ## AnanCore Windows Portable Build

          Gebaseerd op [ChasingCoffee/AnanCore]( https://github.com/ChasingCoffee/AnanCore) release **$upstream**.

          ### Gebruik
          1. Download en pak de zip uit
          2. Dubbelklik ``Start-AnanCore.bat``
          3. Open browser op http://localhost:6060

          ### Vereisten
          Geen — dit is een self-contained portable build (.NET runtime inbegrepen).

          ### Build info
          - AnanCore commit: $commitHash
          - Branch: freedv-in-core
          - Platform: Windows x64
          "@
          gh release create $tag $zip `
            --repo $env:GITHUB_REPOSITORY `
            --title "AnanCore Windows $tag" `
            --notes $notes
          Write-Host "Release gepubliceerd: $tag"
