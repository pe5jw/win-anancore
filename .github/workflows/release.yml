name: Auto Release

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force build even if release already exists'
        type: boolean
        default: false

jobs:
  check-and-release:
    name: Check AnanCore and publish
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout win-anancore
        uses: actions/checkout@v4

      - name: Get latest AnanCore commit
        id: upstream
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $branch = "freedv-in-core"
          $headers = @{
            "User-Agent"    = "win-anancore-builder"
            "Authorization" = "Bearer $env:GH_TOKEN"
            "Accept"        = "application/vnd.github+json"
          }
          $resp = Invoke-RestMethod `
            "https://api.github.com/repos/ChasingCoffee/AnanCore/commits/$branch" `
            -Headers $headers
          $sha   = $resp.sha
          $short = $sha.Substring(0, 7)
          $date  = ([string]$resp.commit.author.date).Substring(0, 10) -replace "-", ""
          $tag   = "build-$date-$short"
          $msg   = $resp.commit.message.Split("`n")[0]
          Write-Host "AnanCore latest commit: $short ($date)"
          Write-Host "Tag: $tag"
          echo "sha=$sha"         >> $env:GITHUB_OUTPUT
          echo "short=$short"     >> $env:GITHUB_OUTPUT
          echo "date=$date"       >> $env:GITHUB_OUTPUT
          echo "tag=$tag"         >> $env:GITHUB_OUTPUT
          echo "message=$msg"     >> $env:GITHUB_OUTPUT
          echo "branch=$branch"   >> $env:GITHUB_OUTPUT

      - name: Check if release already exists
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.upstream.outputs.tag }}"
          $exists = "false"
          $result = gh release view $tag --repo $env:GITHUB_REPOSITORY 2>&1
          if ($LASTEXITCODE -eq 0) { $exists = "true" }
          Write-Host "Release $tag exists: $exists"
          echo "exists=$exists" >> $env:GITHUB_OUTPUT

      - name: Skip if release already exists
        if: steps.check.outputs.exists == 'true' && github.event.inputs.force != 'true'
        shell: pwsh
        run: |
          Write-Host "Release ${{ steps.upstream.outputs.tag }} already exists - nothing to do."

      - name: Setup .NET 10
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build AnanCore distro
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force == 'true'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process
          .\Install-AnanCore.ps1 -Branch "${{ steps.upstream.outputs.branch }}" -SkipDependencyCheck

      - name: Zip distro
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force == 'true'
        id: zip
        shell: pwsh
        run: |
          $tag     = "${{ steps.upstream.outputs.tag }}"
          $zipName = "AnanCore-windows-x64-$tag.zip"
          Compress-Archive -Path distro\* -DestinationPath $zipName
          Write-Host "Created zip: $zipName"
          echo "zip=$zipName" >> $env:GITHUB_OUTPUT

      - name: Write release notes
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force == 'true'
        shell: pwsh
        run: |
          $short  = "${{ steps.upstream.outputs.short }}"
          $sha    = "${{ steps.upstream.outputs.sha }}"
          $date   = "${{ steps.upstream.outputs.date }}"
          $msg    = "${{ steps.upstream.outputs.message }}"
          $branch = "${{ steps.upstream.outputs.branch }}"
          $d = "$($date.Substring(0,4))-$($date.Substring(4,2))-$($date.Substring(6,2))"
          $notes = "## AnanCore Windows Portable Build`n`n"
          $notes += "Built from [ChasingCoffee/AnanCore](https://github.com/ChasingCoffee/AnanCore) branch ``$branch``.`n`n"
          $notes += "| | |`n|---|---|`n"
          $notes += "| **Commit** | [$short](https://github.com/ChasingCoffee/AnanCore/commit/$sha) |`n"
          $notes += "| **Date** | $d |`n"
          $notes += "| **Message** | $msg |`n`n"
          $notes += "### How to use`n"
          $notes += "1. Download and extract the zip`n"
          $notes += "2. Double-click ``Start-AnanCore.bat```n"
          $notes += "3. Open your browser at http://localhost:6060`n`n"
          $notes += "### Requirements`n"
          $notes += "None - self-contained portable build (.NET runtime included).`n`n"
          $notes += "> Warning: Experimental - not supported by AnanCore, ANAN, or any other party.`n"
          $notes += "> Issues with this Windows build: open an issue in this repository."
          $notes | Set-Content release-notes.md -Encoding UTF8

      - name: Publish GitHub Release
        if: steps.check.outputs.exists == 'false' || github.event.inputs.force == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.upstream.outputs.tag }}"
          $zip = "${{ steps.zip.outputs.zip }}"
          gh release create $tag $zip `
            --repo $env:GITHUB_REPOSITORY `
            --title "AnanCore Windows $tag" `
            --notes-file release-notes.md
          Write-Host "Published release: $tag"
