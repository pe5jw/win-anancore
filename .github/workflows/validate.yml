name: Validate Installer Script

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-powershell:
    name: PowerShell Syntax Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            "${{ github.workspace }}\Install-AnanCore.ps1",
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "Syntax OK" -ForegroundColor Green

      - name: Check script with PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path Install-AnanCore.ps1 -Severity Warning,Error
          if ($results) {
            $results | Format-Table -AutoSize
            # Alleen fouten zijn fataal, warnings zijn informatief
            $errors = $results | Where-Object { $_.Severity -eq 'Error' }
            if ($errors) { exit 1 }
          } else {
            Write-Host "Geen problemen gevonden" -ForegroundColor Green
          }

      - name: Dry-run check (SkipBuild + SkipDependencyCheck)
        shell: pwsh
        run: |
          # We kunnen niet echt bouwen in CI (geen .NET 10 / AnanCore clone gewenst)
          # maar we kunnen testen of het script de params accepteert
          $output = & pwsh -NonInteractive -Command {
            # Controleer dat de params bestaan zonder daadwerkelijk te runnen
            $params = (Get-Command .\Install-AnanCore.ps1).Parameters
            @('Branch','SkipBuild','SkipDependencyCheck') | ForEach-Object {
              if (-not $params.ContainsKey($_)) {
                throw "Parameter '$_' ontbreekt"
              }
              Write-Host "Parameter aanwezig: $_"
            }
          } 2>&1
          Write-Host $output
